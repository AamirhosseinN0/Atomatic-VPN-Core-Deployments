          } | sed -E \
              -e 's#((vless|vmess|trojan|hy2|hysteria2|tuic|anytls|ss|snell|socks|naive)://)[^[:space:]]+#\1<redacted>#g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g' \
              -e 's/[A-Za-z0-9+/=]{40,}/<redacted-blob>/g' \

  # ---------------------------------------------------------------------------
  # Report — assemble an index from the job artifacts and publish the
  # redacted reports to the readme-test-results branch, where they can be
  # fetched without authentication.
  # ---------------------------------------------------------------------------
  report:
    name: "Publish test report"
    needs: [ikev2, singbox, xray, mihomo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Index and push to readme-test-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID='${{ github.run_id }}'
          BRANCH=readme-test-results
          DEST="reports/${RUN_ID}"
          mkdir -p "$DEST"
          for d in artifacts/report-*/; do
            [[ -d "$d" ]] || continue
            job="$(basename "$d" | sed 's/^report-//')"
            cp "$d"/*.md "$DEST/" 2>/dev/null || true
            cp "$d/status" "$DEST/${job}.status" 2>/dev/null || true
          done
          {
            echo "# Fresh-setup test — run ${RUN_ID}"
            echo
            echo "- commit: [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- event: ${{ github.event_name }}"
            echo
            echo "| job | result |"
            echo "|---|---|"
            for d in artifacts/report-*/; do
              [[ -d "$d" ]] || continue
              job="$(basename "$d" | sed 's/^report-//')"
              st="$(tr '\n' ' ' < "$d/status" 2>/dev/null || true)"
              echo "| [${job}](${job}.md) | ${st:-no report produced} |"
            done
          } > "$DEST/index.md"

          WORK="$RUNNER_TEMP/reportrepo"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          git init -q
          git config user.name  "readme-setup-test"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -q -B "$BRANCH" "origin/${BRANCH}"
          else
            git checkout -q -b "$BRANCH"
          fi
          mkdir -p "$WORK/$DEST"
          cp "${GITHUB_WORKSPACE}/${DEST}"/* "$WORK/$DEST"/
          git add -A
          git commit -qm "run ${RUN_ID} — ${GITHUB_SHA}"
          for _ in 1 2 3 4 5; do
            if git push -q origin "$BRANCH"; then
              echo "report published to ${BRANCH}/${DEST}/"
              exit 0
            fi
            git fetch -q origin "$BRANCH"
            git rebase -q "origin/${BRANCH}" || { git rebase --abort || true; }
            sleep 5
          done
          echo "::warning::could not push the report branch"
